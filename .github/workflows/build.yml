name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (for example v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the Electron binary is not needed for type checks, unit tests and bundling
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      # the windows of other programs are read through koffi, which only runs on Windows: this declares the system's
      # functions the way the app does and looks for a window that is opened here. It only tells; it never stops a release
      - name: Check that the windows of other programs can be read
        continue-on-error: true
        shell: pwsh
        run: |
          $window = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-File', 'scripts/win32-smoke-window.ps1'
          Start-Sleep -Seconds 6
          try { node scripts/win32-smoke.mjs buddy-smoke-window } finally { Stop-Process -Id $window.Id -Force -ErrorAction SilentlyContinue }
          # and the same library has to load from inside the installed app (its asar, with the native part unpacked)
          $app = Get-ChildItem release/win-unpacked -Filter '*.exe' | Where-Object { $_.Name -notmatch 'elevate|uninstall' } | Select-Object -First 1
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $app.FullName scripts/win32-packaged-smoke.cjs (Join-Path $app.DirectoryName 'resources')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # latest.yml (version, file name and checksum of the installer) and the .blockmap are what an installed app reads
      # to update itself, so a build without them is a broken release
      - name: Check the update files
        shell: bash
        run: |
          ls -la release
          cat release/latest.yml
          test -f release/latest.yml
          test -f release/DesktopBuddy-Setup.exe.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/DesktopBuddy-Setup.exe
            release/DesktopBuddy-Setup.exe.blockmap
            release/DesktopBuddy-Portable.zip
            release/latest.yml
          if-no-files-found: error
      # pushing a tag like v0.1.0, or running this workflow by hand with release_tag set, publishes the installer,
      # the portable zip and the update files as a GitHub release (a manual run creates the tag on this commit)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # an installed app compares the version in latest.yml with its own: a tag that disagrees with package.json
          # would offer nobody the update, or offer it forever
          version=$(sed -n 's/^version: //p' release/latest.yml | tr -d "\r'\"")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match version $version in package.json; bump it first." >&2
            exit 1
          fi
          # the release says what CHANGELOG.md says about this version; a version with nothing written there stops here
          node scripts/release-notes.mjs "$version" > release/NOTES.md
          cat release/NOTES.md
          gh release create "$TAG" \
            release/DesktopBuddy-Setup.exe release/DesktopBuddy-Setup.exe.blockmap \
            release/DesktopBuddy-Portable.zip release/latest.yml \
            --title "$TAG" --notes-file release/NOTES.md --target "$GITHUB_SHA"
