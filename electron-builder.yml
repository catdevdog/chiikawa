appId: io.github.catdevdog.desktop-buddy
productName: Desktop Buddy
copyright: Desktop Buddy contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: skins/default
    to: skins/default
  - from: skins/usagi
    to: skins/usagi
  - from: skins/hachiware
    to: skins/hachiware
  - from: skins/chiikawa
    to: skins/chiikawa
  - from: skins/rakko
    to: skins/rakko
asar: true
# The workflow publishes the release itself with gh (npm run dist never uploads). This only tells the build where an
# installed app looks for newer versions: it writes resources/app-update.yml into the app and latest.yml next to the
# installer.
publish:
  provider: github
  owner: catdevdog
  repo: chiikawa
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  # Fixed file names (no version) so README links can use releases/latest/download/<name>.
  artifactName: DesktopBuddy-Portable.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: Desktop Buddy
  artifactName: DesktopBuddy-Setup.${ext}
